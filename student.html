
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173f32">
<title>في رحاب القرآن | فضاء الطالب</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f4ef;color:#1c2b23;font-family:Tahoma,Arial,sans-serif;line-height:1.7}
header{background:#173f32;color:white;padding:25px 16px;text-align:center}
header h1{margin:0;color:#f1e5bd}
main{max-width:650px;margin:24px auto;padding:0 14px}
.panel{background:white;border:1px solid #e0e6de;border-radius:16px;padding:20px;margin-bottom:16px}
h2{font-size:21px;margin:0 0 12px}
label{display:block;font-size:14px;font-weight:bold;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #ccd7cd;border-radius:9px;font:inherit;background:white}
button{border:0;border-radius:9px;background:#2e6847;color:white;padding:11px 14px;font:inherit;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#e8eee7;color:#254a34}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.actions button{flex:1}
.primary{width:100%;margin-top:16px}
.status{padding:10px 0;white-space:pre-wrap}
.muted{color:#69766d;font-size:13px}
.hidden{display:none!important}
.card{background:#f5f8f3;padding:13px;border-radius:10px;margin-top:10px}
audio{width:100%;margin-top:12px}
footer{text-align:center;color:#69766d;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<h1>۞ في رحاب القرآن</h1>
<p>فضاء الطالب للحفظ والمراجعة</p>
</header>

<main>
<section id="authPanel" class="panel">
<h2>مرحبًا بك في فضاء الطالب</h2>
<p class="muted">استعمل رمز الطالب الذي أعطاك إياه المحفّظ.</p>

<div class="actions">
<button type="button" id="showEmail" class="secondary">إنشاء حساب بالإيميل</button>
<button type="button" id="showPhone" class="secondary">إنشاء حساب بالهاتف</button>
<button type="button" id="showLogin" class="secondary">عندي حساب</button>
</div>

<form id="emailSignup">
<label for="emailCode">رمز الطالب</label>
<input id="emailCode" required placeholder="رمز الطالب من المحفّظ">
<label for="signupEmail">البريد الإلكتروني</label>
<input id="signupEmail" type="email" required>
<label for="emailPassword">كلمة السر (8 أحرف على الأقل)</label>
<input id="emailPassword" type="password" minlength="8" required>
<label for="emailConfirm">تأكيد كلمة السر</label>
<input id="emailConfirm" type="password" minlength="8" required>
<button class="primary" type="submit">إنشاء الحساب</button>
</form>

<form id="phoneSignup" class="hidden">
<label for="phoneCode">رمز الطالب</label>
<input id="phoneCode" required>
<label for="signupPhone">رقم الهاتف مع رمز الدولة</label>
<input id="signupPhone" type="tel" required placeholder="+216XXXXXXXX">
<label for="phonePassword">كلمة السر</label>
<input id="phonePassword" type="password" minlength="8" required>
<label for="phoneConfirm">تأكيد كلمة السر</label>
<input id="phoneConfirm" type="password" minlength="8" required>
<button class="primary" type="submit">إنشاء الحساب</button>
</form>

<form id="verifyForm" class="hidden">
<label for="otp">رمز التحقق الذي وصلك برسالة</label>
<input id="otp" inputmode="numeric" required>
<button class="primary" type="submit">تأكيد الحساب</button>
</form>

<form id="loginForm" class="hidden">
<label for="loginMethod">طريقة الدخول</label>
<select id="loginMethod">
<option value="email">البريد الإلكتروني</option>
<option value="phone">رقم الهاتف</option>
</select>
<label for="loginIdentity">الإيميل أو الهاتف</label>
<input id="loginIdentity" required autocomplete="username">
<label for="loginPassword">كلمة السر</label>
<input id="loginPassword" type="password" required autocomplete="current-password">
<label for="loginStudentCode">رمز الطالب إذا لم يتم ربط الحساب</label>
<input id="loginStudentCode" placeholder="اتركه فارغًا إذا كان مربوطًا">
<button class="primary" type="submit">دخول</button>
</form>

<p id="status" class="status" role="status" aria-live="polite"></p>
</section>

<section id="studentPanel" class="panel hidden">
<h2>فضاء الطالب</h2>
<p id="welcome"></p>
<div id="profile" class="card"></div>

<div class="card">
<h2>إرسال التسميع إلى المحفّظ</h2>
<form id="studentRecitationForm">
<label for="studentSurah">السورة أو الجزء</label>
<input id="studentSurah" required maxlength="160" placeholder="مثال: سورة الملك">

<div class="actions">
<div style="flex:1;min-width:120px">
<label for="verseStart">من آية</label>
<input id="verseStart" type="number" min="1">
</div>
<div style="flex:1;min-width:120px">
<label for="verseEnd">إلى آية</label>
<input id="verseEnd" type="number" min="1">
</div>
</div>

<div class="actions">
<button type="button" id="startRecording">🎙️ بدء التسجيل</button>
<button type="button" id="stopRecording" disabled>⏹️ إيقاف التسجيل</button>
</div>

<audio id="audioPreview" controls hidden></audio>
<p id="recordingStatus" class="muted" role="status" aria-live="polite">لم يبدأ التسجيل بعد.</p>
<button type="submit" id="sendRecitation" class="primary">إرسال التسميع إلى المحفّظ</button>
</form>
</div>

<button id="logout" class="secondary" type="button">تسجيل الخروج</button>
</section>
</main>

<footer>في رحاب القرآن · فضاء الطالب</footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
'use strict';

const SUPABASE_URL='https://yysruuckpfqzymvpioce.supabase.co';
const SUPABASE_KEY='sb_publishable_YxRCrAWRLzmn7DHD2nk1Ig_GniEdvxU';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let pendingPhone='';
let recorder=null;
let chunks=[];
let audioBlob=null;
let stream=null;
let previewUrl=null;

function showForm(formId,message=''){
  ['emailSignup','phoneSignup','verifyForm','loginForm'].forEach(id=>{
    $(id).classList.toggle('hidden',id!==formId);
  });
  $('status').textContent=message;
}

$('showEmail').onclick=()=>showForm('emailSignup');
$('showPhone').onclick=()=>showForm('phoneSignup');
$('showLogin').onclick=()=>showForm('loginForm');

function checkPassword(password,confirm){
  if(password.length<8)throw Error('كلمة السر يجب أن تكون 8 أحرف على الأقل.');
  if(password!==confirm)throw Error('كلمتا السر غير متطابقتين.');
}

async function getLinkedStudent(code=''){
  const {data:authData,error:authError}=await supabaseClient.auth.getUser();
  if(authError)throw authError;
  if(!authData.user)throw Error('سجّل الدخول بحساب الطالب أولًا.');

  const user=authData.user;
  let {data:student,error}=await supabaseClient
    .from('Student')
    .select('*')
    .eq('student_user_id',user.id)
    .maybeSingle();

  if(error)throw Error('تعذّرت قراءة ملف الطالب: '+error.message);

  const studentCode=String(code||user.user_metadata?.student_code||'').trim().toUpperCase();

  if(!student&&studentCode){
    const {error:claimError}=await supabaseClient.rpc('claim_student_profile',{
      p_student_code:studentCode
    });
    if(claimError)throw Error('تعذّر ربط ملف الطالب: '+claimError.message);

    const result=await supabaseClient
      .from('Student')
      .select('*')
      .eq('student_user_id',user.id)
      .maybeSingle();

    if(result.error)throw Error('تعذّرت قراءة ملف الطالب: '+result.error.message);
    student=result.data;
  }

  if(!student)throw Error('الحساب غير مربوط بملف طالب. تأكد من رمز الطالب مع المحفّظ.');
  if(!student.teacher_id)throw Error('لم يتم تحديد المحفّظ لهذا الطالب.');

  return {user,student};
}

async function loadStudent(code=''){
  const {student}=await getLinkedStudent(code);
  $('authPanel').classList.add('hidden');
  $('studentPanel').classList.remove('hidden');
  $('welcome').textContent='مرحبًا '+(student.full_name||student.full||student.name||'بك')+'.';
  $('profile').textContent='موضع الحفظ: '+(student.start_surah||student.start||'لم يحدد')+
    ' — المستوى: '+(student.level||'لم يحدد')+
    ' — المقدار المستهدف: '+(student.daily_goal||student.goal||'لم يحدد');
}

$('emailSignup').addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    checkPassword($('emailPassword').value,$('emailConfirm').value);
    const code=$('emailCode').value.trim().toUpperCase();
    if(!code)throw Error('أدخل رمز الطالب.');
    const {data,error}=await supabaseClient.auth.signUp({
      email:$('signupEmail').value.trim().toLowerCase(),
      password:$('emailPassword').value,
      options:{data:{role:'student',student_code:code}}
    });
    if(error)throw error;
    if(data.session)await loadStudent(code);
    else showForm('loginForm','تم إنشاء الحساب. أكّد بريدك الإلكتروني ثم سجّل الدخول وأدخل رمز الطالب.');
  }catch(err){$('status').textContent='تعذّر إنشاء الحساب: '+err.message;}
});

$('phoneSignup').addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    checkPassword($('phonePassword').value,$('phoneConfirm').value);
    pendingPhone=$('signupPhone').value.trim();
    const code=$('phoneCode').value.trim().toUpperCase();
    const {data,error}=await supabaseClient.auth.signUp({
      phone:pendingPhone,
      password:$('phonePassword').value,
      options:{data:{role:'student',student_code:code}}
    });
    if(error)throw error;
    if(data.session)await loadStudent(code);
    else showForm('verifyForm','أدخل رمز التحقق الذي وصلك برسالة نصية.');
  }catch(err){$('status').textContent='تعذّر إنشاء الحساب: '+err.message;}
});

$('verifyForm').addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    const {error}=await supabaseClient.auth.verifyOtp({
      phone:pendingPhone,token:$('otp').value.trim(),type:'sms'
    });
    if(error)throw error;
    await loadStudent($('phoneCode').value.trim());
  }catch(err){$('status').textContent='تعذّر التحقق: '+err.message;}
});

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  try{
    const method=$('loginMethod').value;
    const identity=$('loginIdentity').value.trim();
    const credentials={password:$('loginPassword').value};
    credentials[method]=method==='email'?identity.toLowerCase():identity;
    const {error}=await supabaseClient.auth.signInWithPassword(credentials);
    if(error)throw error;
    await loadStudent($('loginStudentCode').value);
  }catch(err){$('status').textContent='تعذّر الدخول: '+err.message;}
});

$('startRecording').addEventListener('click',async()=>{
  try{
    await getLinkedStudent();
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)
      throw Error('المتصفح لا يدعم التسجيل الصوتي.');

    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    audioBlob=null;

    const type=['audio/webm;codecs=opus','audio/webm','audio/mp4']
      .find(t=>MediaRecorder.isTypeSupported(t));
    recorder=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);

    recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    recorder.onstop=()=>{
      audioBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});
      if(previewUrl)URL.revokeObjectURL(previewUrl);
      previewUrl=URL.createObjectURL(audioBlob);
      $('audioPreview').src=previewUrl;
      $('audioPreview').hidden=false;
      $('recordingStatus').textContent='اكتمل التسجيل. اسمعه قبل الإرسال.';
      $('startRecording').disabled=false;
      $('stopRecording').disabled=true;
      stream?.getTracks().forEach(t=>t.stop());
      stream=null;
    };

    recorder.start();
    $('startRecording').disabled=true;
    $('stopRecording').disabled=false;
    $('recordingStatus').textContent='التسجيل جارٍ...';
  }catch(err){
    $('recordingStatus').textContent='تعذّر بدء التسجيل: '+err.message;
    stream?.getTracks().forEach(t=>t.stop());
    stream=null;
    $('startRecording').disabled=false;
    $('stopRecording').disabled=true;
  }
});

$('stopRecording').addEventListener('click',()=>{
  if(recorder?.state==='recording')recorder.stop();
});

$('studentRecitationForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!audioBlob){
    $('recordingStatus').textContent='سجّل صوتك وأوقف التسجيل قبل الإرسال.';
    return;
  }

  const surah=$('studentSurah').value.trim();
  const startText=$('verseStart').value.trim();
  const endText=$('verseEnd').value.trim();
  const verseStart=startText?Number(startText):null;
  const verseEnd=endText?Number(endText):null;

  if((verseStart!==null&&(!Number.isInteger(verseStart)||verseStart<1))||
     (verseEnd!==null&&(!Number.isInteger(verseEnd)||verseEnd<1))){
    $('recordingStatus').textContent='أرقام الآيات يجب أن تكون أعدادًا موجبة.';
    return;
  }
  if(verseStart!==null&&verseEnd!==null&&verseEnd<verseStart){
    $('recordingStatus').textContent='رقم الآية الأخيرة يجب أن يتجاوز الأولى أو يساويها.';
    return;
  }

  const button=$('sendRecitation');
  button.disabled=true;
  $('recordingStatus').textContent='جارٍ رفع التسجيل وحفظه...';
  let path=null;

  try{
    const {user,student}=await getLinkedStudent();
    const ext=audioBlob.type.includes('mp4')?'m4a':audioBlob.type.includes('ogg')?'ogg':'webm';
    path=user.id+'/'+crypto.randomUUID()+'.'+ext;

    const {error:uploadError}=await supabaseClient.storage
      .from('recitation')
      .upload(path,audioBlob,{contentType:audioBlob.type||'audio/webm',upsert:false});
    if(uploadError)throw Error('فشل رفع الصوت: '+uploadError.message);

    const {error:insertError}=await supabaseClient.from('Recitation').insert({
      id:crypto.randomUUID(),
      student_id:student.id,
      teacher_id:student.teacher_id,
      surah:surah,
      verse_start:verseStart,
      verse_end:verseEnd,
      recitation_date:new Date().toISOString(),
      audio_url:path
    });

    if(insertError){
      await supabaseClient.storage.from('recitation').remove([path]);
      throw Error('رُفع الصوت لكن تعذّر حفظ بيانات التسميع: '+insertError.message);
    }

    $('recordingStatus').textContent='تم إرسال التسميع وحفظه بنجاح.';
    audioBlob=null;
    chunks=[];
    e.target.reset();
    $('audioPreview').pause();
    $('audioPreview').removeAttribute('src');
    $('audioPreview').hidden=true;
    if(previewUrl)URL.revokeObjectURL(previewUrl);
    previewUrl=null;
  }catch(err){
    $('recordingStatus').textContent='تعذّر إرسال التسميع: '+err.message;
  }finally{
    button.disabled=false;
  }
});

$('logout').addEventListener('click',async()=>{
  const {error}=await supabaseClient.auth.signOut();
  if(error){
    $('recordingStatus').textContent='تعذّر تسجيل الخروج: '+error.message;
    return;
  }
  stream?.getTracks().forEach(t=>t.stop());
  $('studentPanel').classList.add('hidden');
  $('authPanel').classList.remove('hidden');
  showForm('loginForm','تم تسجيل الخروج.');
});

(async()=>{
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error)throw error;
    if(data.session)await loadStudent();
  }catch(err){
    $('status').textContent='تعذّر تحميل حساب الطالب: '+err.message;
  }
})();
</script>
</body>
</html>
