<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>في رحاب القرآن - تسجيلات الطلبة</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f3;
      color: #173f32;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
    }
    h1 { font-size: 25px; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      background: #246344;
      color: white;
      border: 0;
      cursor: pointer;
    }
    .secondary { background: #777; }
    .item {
      border: 1px solid #ddd;
      padding: 14px;
      margin: 12px 0;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    audio { width: 100%; margin-top: 10px; }
    #message { white-space: pre-wrap; }
    .error { color: #b00020; }
  </style>
</head>
<body>
<main>
  <h1>في رحاب القرآن</h1>
  <h2>إدارة تسميع الطلبة</h2>

  <section id="loginSection">
    <p>الدخول إلى حساب الإدارة</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="البريد الإلكتروني للإدارة" required>
      <input id="password" type="password" placeholder="كلمة السر" required>
      <button type="submit">دخول</button>
    </form>
  </section>

  <section id="adminSection" hidden>
    <p id="accountInfo"></p>
    <button id="refreshButton">تحديث التسجيلات</button>
    <button id="logoutButton" class="secondary">خروج</button>
    <p id="message">اضغط على تحديث التسجيلات.</p>
    <div id="recordings"></div>
  </section>
</main>

<script>
const SUPABASE_URL = 'https://yysruuckpfqzymvpioce.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YxRCrAWRLzmn7DHD2nk1Ig_GniEdvxU';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const loginSection = document.getElementById('loginSection');
const adminSection = document.getElementById('adminSection');
const message = document.getElementById('message');
const recordings = document.getElementById('recordings');

function showMessage(text, error = false) {
  message.textContent = text;
  message.className = error ? 'error' : '';
}

async function loadRecitations() {
  recordings.replaceChildren();
  showMessage('قاعدين نحمّلوا التسجيلات...');

  const { data: sessionData } = await supabaseClient.auth.getSession();
  const user = sessionData.session?.user;

  if (!user) {
    showMessage('يلزمك تدخل لحساب الإدارة من جديد.', true);
    return;
  }

  const { data, error } = await supabaseClient
    .from('recitations')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    showMessage(
      'تعذّر جلب التسجيلات:\n' + error.message +
      '\n\nتثبّت من اسم الجدول وصلاحيات القراءة (RLS) في Supabase.',
      true
    );
    return;
  }

  if (!data || data.length === 0) {
    showMessage('ما ظهرت حتى تسجيلات. إذا الطلبة بعثوا تسجيلات، يلزمنا نراجعوا صلاحيات Supabase وطريقة الإرسال.');
    return;
  }

  const studentIds = [...new Set(
    data.map(r => r.student_id).filter(Boolean)
  )];

  let students = [];
  if (studentIds.length > 0) {
    const result = await supabaseClient
      .from('Student')
      .select('id, full_name')
      .in('id', studentIds);

    if (!result.error && result.data) {
      students = result.data;
    }
  }

  const studentNames = new Map(
    students.map(s => [String(s.id), s.full_name || 'طالب'])
  );

  for (const r of data) {
    const card = document.createElement('article');
    card.className = 'item';

    const heading = document.createElement('h3');
    heading.textContent =
      'الطالب: ' +
      (studentNames.get(String(r.student_id)) ||
       r.student_name || 'الاسم غير متوفر');
    card.appendChild(heading);

    const details = [
      ['السورة', r.surah],
      ['من الآية', r.verse_start],
      ['إلى الآية', r.verse_end],
      ['التاريخ', r.recitation_date || r.created_at],
      ['التقييم', r.grade],
      ['الأخطاء', r.mistakes],
      ['ملاحظات الأستاذ', r.teacher_notes || r.note]
    ];

    for (const [label, value] of details) {
      if (value !== null && value !== undefined && value !== '') {
        const p = document.createElement('p');
        p.textContent = label + ': ' + value;
        card.appendChild(p);
      }
    }

    if (r.audio_url) {
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'none';

      if (/^https?:\/\//i.test(r.audio_url)) {
        audio.src = r.audio_url;
      } else {
        const { data: audioData, error: audioError } =
          await supabaseClient.storage
            .from('recitation')
            .createSignedUrl(r.audio_url, 3600);

        if (!audioError && audioData?.signedUrl) {
          audio.src = audioData.signedUrl;
        } else {
          const p = document.createElement('p');
          p.textContent = 'تعذّر فتح الصوت. تثبّت من صلاحيات ملف الصوت في Storage.';
          card.appendChild(p);
        }
      }

      card.appendChild(audio);
    } else {
      const p = document.createElement('p');
      p.textContent = 'ما فماش رابط صوت مسجّل في هذا السجل.';
      card.appendChild(p);
    }

    recordings.appendChild(card);
  }

  showMessage('عدد سجلات التسميع: ' + data.length);
}

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  showMessage('قاعدين ندخلوا للحساب...');

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });

  if (error) {
    showMessage('تعذّر الدخول: ' + error.message, true);
    return;
  }

  await updateScreen();
});

async function updateScreen() {
  const { data } = await supabaseClient.auth.getSession();
  const user = data.session?.user;

  loginSection.hidden = !!user;
  adminSection.hidden = !user;

  if (user) {
    document.getElementById('accountInfo').textContent =
      'الحساب: ' + user.email;
    await loadRecitations();
  }
}

document.getElementById('refreshButton')
  .addEventListener('click', loadRecitations);

document.getElementById('logoutButton')
  .addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    recordings.replaceChildren();
    showMessage('');
    await updateScreen();
  });

updateScreen();
</script>
</body>
</html>
